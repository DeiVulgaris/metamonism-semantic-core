# D_ext exhaustion formalization tests
suite: DEXT_EXHAUSTION_FORMALIZATION
cases:
  - id: DEXT-V1
    claim: D_ext is a formalization of admissible external continuations.
    expected: ACCEPT
  - id: DEXT-V2
    claim: Exhaustion means D_ext(S)=empty_set.
    expected: ACCEPT
  - id: DEXT-V3
    claim: Frustration requires both continuation and exhaustion.
    expected: ACCEPT
  - id: DEXT-V4
    claim: P4 is generated by an additional external direction.
    expected: REJECT
  - id: DEXT-V5
    claim: J is already a reflection operator.
    expected: REJECT
  - id: DEXT-V6
    claim: J^2=-I follows from +n -> -n.
    expected: REJECT
  - id: DEXT-V7
    claim: D_ext must be a vector space.
    expected: REJECT
  - id: DEXT-V8
    claim: The transition structure already proves Clifford algebra.
    expected: REJECT
  - id: DEXT-V9
    claim: Exhaustion boundary is a physical spatial surface.
    expected: REJECT
  - id: DEXT-V10
    claim: G={T1,T2,T3,J} is a derived Clifford generating set.
    expected: REJECT