name: Research Loop v0

on:
  push:
    paths:
      - "stage62_research_loop_v0/**"
      - ".github/workflows/research_loop_v0.yml"
  pull_request:
    paths:
      - "stage62_research_loop_v0/**"
      - ".github/workflows/research_loop_v0.yml"
  workflow_dispatch:

jobs:
  research_loop_v0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install pyyaml jsonschema
      - name: Run deterministic R0 suite
        working-directory: stage62_research_loop_v0
        run: |
          PYTHONPATH=. python test_research_loop_v0.py
