      - id: "f2"
        kind: "formalization"
        status: "SOURCE"
        source_claim: "¬∃ x : (x ≡ x ∧ ¬diff(x))"
        source_claim_as_interpreted: "The source itself supplies a symbolic expression for the prohibition."
        provenance: {repository: "Deivulgaris66/Metamonism", path: "CORE/axioms.yaml", ref: "9f107f36b1a18633261e9666b32a59340c5f345d", locator: "axiom_ban_of_absolute_identity / formal_expression"}
      - id: "f3"
        kind: "claim"
        status: "SOURCE"
        source_claim: "The prohibition corresponds to conservation of momentum at the physical level."
        source_claim_as_interpreted: "The corpus asserts an ontology-to-physics correspondence."
        provenance: {repository: "Deivulgaris66/Metamonism", path: "CORE/axioms.yaml", ref: "9f107f36b1a18633261e9666b32a59340c5f345d", locator: "axiom_ban_of_absolute_identity / physical_interpretation"}
      - id: "f4"
        kind: "relation"
        status: "SOURCE"
        source_entity: "Prohibition"
        relation_type: "CORRESPONDS_TO"
        target_entity: "Conservation of momentum"
        provenance: {repository: "Deivulgaris66/Metamonism", path: "CORE/axioms.yaml", ref: "9f107f36b1a18633261e9666b32a59340c5f345d", locator: "axiom_ban_of_absolute_identity / physical_interpretation / Ontology → Physics mapping"}
      - id: "f5"
        kind: "claim"
        status: "INFERENCE"
        source_claim: "The symbolic expression is mathematically valid."
        source_claim_as_interpreted: "No such validation is supplied by the source; this requires independent formal analysis."
        derived_from: ["f2"]
        provenance: {repository: "Deivulgaris66/Metamonism", path: "CORE/axioms.yaml", ref: "9f107f36b1a18633261e9666b32a59340c5f345d", locator: "Derived benchmark check; not a source assertion"}
