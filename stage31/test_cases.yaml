        status: "SOURCE"
        source_entity: "Monos"
        relation_type: "STRUCTURAL_CORRESPONDENCE"
        target_entity: "Logos"
        provenance: {repository: "Deivulgaris66/Metamonism", path: "CORE/core_v1.2.md", ref: "9f107f36b1a18633261e9666b32a59340c5f345d", locator: "Principles / Isomorphism"}
