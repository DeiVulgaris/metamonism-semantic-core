        provenance: {repository: "Deivulgaris66/Metamonism", path: "CORE/core_v1.2.md", ref: "9f107f36b1a18633261e9666b32a59340c5f345d", locator: "Key Concepts / Categories / Monos"}
      - id: "p3"
        kind: "entity"
        status: "SOURCE"
