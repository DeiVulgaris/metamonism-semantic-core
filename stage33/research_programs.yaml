        source_claim: "R1-R4 form a recursive cycle; R4 carries a minus sign."
        status: SOURCE
        provenance:
          repository: "DeiVulgaris/metamonism-semantic-core"
          path: "stage32/test_cases.yaml"
          ref: "stage32-research-hypotheses-validation"
          locator: "r1_r4_dirac"
