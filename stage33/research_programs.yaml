          ref: "stage32-research-hypotheses-validation"
          locator: "r1_r4_dirac"
    candidate_formalizations:
      - expression: "{gamma_mu,gamma_nu}=2 g_mu_nu"
        role: "external formal reference"
        status: SOURCE
        validation: "reference_only; not a derivation of R1-R4"
    required_definitions:
      - term: "state space of R1-R4"
        question: "What mathematical objects do R1...R4 act on?"
        blocking: true
      - term: "composition law"
        question: "What operation composes the R-states?"
        blocking: true
      - term: "sign/orientation operator"
        question: "What operation produces the R4 sign reversal?"
        blocking: true
      - term: "closure multiplicity"
        question: "Does one closure or two closures restore the initial state?"
        blocking: true
    tests:
      - id: rp.r1r4.t1
        test: "Construct an explicit algebraic representation of R1-R4."
        expected_observation: "A closed operation exists and preserves the stated process semantics."
        falsifier: "No coherent composition law can represent the cycle."
        status: OPEN
      - id: rp.r1r4.t2
        test: "Compare closure behavior with a defined Clifford/spinor representation."
        expected_observation: "A precise invariant or operation corresponds."
        falsifier: "Only visual or verbal similarity remains."
        status: OPEN
    derivations: []
    counterexamples: []
    open_questions:
      - "Is the sign reversal an algebraic operation or only notation?"
      - "What invariant survives closure?"
      - "What distinguishes single from double closure?"
      - "Can the proposed structure generate a representation rather than merely resemble one?"
    forbidden_inferences:
      - "R1-R4 already implement Dirac algebra."
      - "A minus sign proves spin-1/2 behavior."
      - "Structural correspondence is formal isomorphism."
      - "Dirac matrices are derivable before an R1-R4 algebra is defined."
    next_transition:
      trigger: "state_space_and_composition_law_defined"
      action: "attempt_explicit_algebraic_formalization"
      evidence_required: "formal definitions plus reproducible derivation"

  - id: mm:rp.frustration_surgery_planck
