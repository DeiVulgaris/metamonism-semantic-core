# =============================================================================
# STABLE ID REGISTRY
# Format: mm:[layer].[category].[canonical_name]
# =============================================================================

id_scheme:
  prefix: "mm"
  separator: "."
  layers: [core, onto, ufcps, eecp, meta]
  categories:
    inv: "Invariant / Axiom"
    dom: "Domain"
    op: "Operator"
    prc: "Process"
    sts: "State (forbidden)"
    reg: "Regime"
    cfg: "Configuration"
    rel: "Relation"
    clm: "Claim"
    mdl: "Model"
    geo: "Geometry"
    top: "Topology"
    inf: "Information"
    cog: "Cognitive Structure"
    prf: "Proof"
    drv: "Derivation"
    prn: "Principle"
    ent: "Entity"
    crit: "Criterion"
    prh: "Prohibited Class"

