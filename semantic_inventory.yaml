- id: mm:core.op.meta_reflection
  canonical_name: "meta-reflection"
  type: "Cognitive Operation"
  layer: "core"
  definition: "Logos distinguishes distinction of distinction. Unbounded recursion."
  status: "SOURCE"
  origin: "CORPUS"
  source: "A1: the_verb.md"
  domain: [mm:core.dom.logos]
  prohibits: ["Stopping = absolute fixation = autoidentity"]

