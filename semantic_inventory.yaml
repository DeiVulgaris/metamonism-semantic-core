# =========================================================================
# INVARIANTS
# =========================================================================
- id: mm:core.inv.ban_of_absolute_identity
  canonical_name: "Ban of Absolute Identity"
  type: "Invariant"
  layer: "core"
  definition: "Absolute identity (a state without distinctions, equivalent to complete indifference) is ontologically impossible."
  status: "SOURCE"
  origin: "CORPUS"
  aliases: ["Indifference Prohibition Axiom", "CMI Axiom", "Prohibition-Momentum Axiom"]
  historical_formulations:
    - statement: "КМИ (Конфликт-Момент-Импульс)"
      period: "Original Russian formulation"
      source: "S1 axioms.yaml historical_context"
      status: "PRIOR_THEORETICAL_FORMULATION"
      relation_to_current: "equivalent_formulation"
  source: "S1: CORE/axioms.yaml; S6: GLOSSARY.md"
  formal_expression: "¬∃ x : (x ≡ x ∧ ¬diff(x))"
  relations:
    - relation: mm:rel.derives
      target: mm:core.op.diff
      status: "SOURCE"
    - relation: mm:rel.derives
      target: mm:core.op.dissipate
      status: "SOURCE"
    - relation: mm:rel.derives
      target: mm:core.prc.cmi
      status: "SOURCE"
  claims:
    - mm:core.clm.ban_enforces_differentiation
    - mm:core.clm.ban_generates_momentum
    - mm:core.clm.ban_necessitates_dissipation
    - mm:core.clm.difference_necessary_from_ban
    - mm:core.clm.motion_follows_from_ban
  ambiguities: []
  conflicts: []
  open_questions:
    - "Does the ban logically necessitate difference? (UNRESOLVED — Dialectical Crucible)"

