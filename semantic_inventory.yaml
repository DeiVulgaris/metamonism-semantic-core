- id: mm:core.dom.monos
  canonical_name: "Monos"
  type: "Domain"
  layer: "core"
  definition: "Reality as continuous, processual differentiation. Non-symbolic, not representable, not modelable, not a static substrate."
  status: "SOURCE"
  origin: "CORPUS"
  aliases: ["Processual Core", "Process in pure form"]
  historical_formulations:
    - statement: "Monos is the process of auto-negation"
      source: "A1: the_verb.md"
      status: "SOURCE"
      relation_to_current: "equivalent_formulation"
  source: "S1: CORE/ontology.yaml; S6: GLOSSARY.md"
  relations:
    - relation: mm:rel.structurally_corresponds_to
      target: mm:core.dom.logos
      status: "SOURCE"
      justification: "S1 principle_isomorphism_monos_logos — asserted without formal mapping"
    - relation: mm:rel.cannot_instantiate
      target: mm:core.sts.absolute_identity
      status: "SOURCE"
    - relation: mm:rel.permits_operator
      target: mm:core.op.diff
      status: "SOURCE"
    - relation: mm:rel.permits_operator
      target: mm:core.op.dissipate
      status: "SOURCE"
    - relation: mm:rel.prohibits_operator
      target: mm:core.op.fix
      status: "SOURCE"
  claims:
    - mm:core.clm.monos_non_symbolic
    - mm:core.clm.monos_not_substance

- id: mm:core.dom.logos
  canonical_name: "Logos"
  type: "Domain"
