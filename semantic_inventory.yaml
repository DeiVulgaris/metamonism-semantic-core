  definition: "Epistemic space of models, theories, and fixed representations. Discrete entities and stable relations exist through fix operations."
  status: "SOURCE"
  origin: "CORPUS"
  aliases: ["Domain of representations", "Space of organized distinctions"]
  source: "S1: CORE/ontology.yaml; S6: GLOSSARY.md"
  relations:
    - relation: mm:rel.structurally_corresponds_to
      target: mm:core.dom.monos
      status: "SOURCE"
    - relation: mm:rel.permits_operator
      target: mm:core.op.fix
      status: "SOURCE"
    - relation: mm:rel.permits_operator
      target: mm:core.op.unfold
      status: "SOURCE"
    - relation: mm:rel.permits_operator
      target: mm:core.op.reflection
      status: "SOURCE"
  claims:
    - mm:core.clm.logos_admits_identity
    - mm:core.clm.logos_not_reality

# =========================================================================
# OPERATORS (claims extracted from definitions)
# =========================================================================
- id: mm:core.op.diff
  canonical_name: "diff"
  type: "Operator"
  layer: "core"
  definition: "Fundamental operation of differentiation producing distinction. Ontologically primitive, non-reversible, non-convergent."
  status: "SOURCE"
  origin: "CORPUS"
  source: "S1: CORE/operators.yaml; S6: OPERATORS.md"
  domain: [mm:core.dom.monos, mm:core.dom.logos]
  input: "Process (continuous substrate)"
  transformation: "Enforced distinction generation"
  output: "Distinction"
  preserves: {status: "UNRESOLVED", note: "Corpus does not explicitly state"}
  destroys: [mm:core.sts.absolute_identity]
  enables: []
  prohibits:
    - "diff must not terminate"
    - "diff must not converge"
    - "diff must not be reversible"
  relations:
    - relation: mm:rel.composes_with
      target: mm:core.op.dissipate
      status: "SOURCE"
    - relation: mm:rel.derives_from
      target: mm:core.inv.ban_of_absolute_identity
      status: "SOURCE"
  claims:
    - mm:core.clm.diff_produces_asymmetry
    - mm:core.clm.diff_initiates_motion
    - mm:core.clm.diff_prevents_equivalence

- id: mm:core.op.dissipate
  canonical_name: "dissipate"
  type: "Operator"
  layer: "core"
  definition: "Compulsory dispersion of distinction; prevents collapse into identity. Destroys symmetry. Mandatory for persistence."
  status: "SOURCE"
  origin: "CORPUS"
  aliases: ["diss"]
  source: "S1: CORE/operators.yaml; S6: OPERATORS.md"
  domain: [mm:core.dom.monos]
  input: "Process / distinction / tendency to fix"
  transformation: "Compulsory dispersion"
  output: "Energy dispersal (ΔS > 0)"
  preserves: ["Non-equilibrium"]
  destroys: ["Symmetry", "Tendency toward fixation"]
  prohibits:
    - "dissipate must not optimize"
    - "dissipate must not preserve structure"
    - "dissipate must not minimize loss"
  relations:
    - relation: mm:rel.composes_with
      target: mm:core.op.fix
      status: "SOURCE"
    - relation: mm:rel.derives_from
      target: mm:core.inv.ban_of_absolute_identity
      status: "SOURCE"
  claims:
    - mm:core.clm.dissipate_produces_entropy
    - mm:core.clm.dissipate_creates_arrow_of_time

- id: mm:core.op.fix
  canonical_name: "fix"
  type: "Operator"
  layer: "core"
  definition: "Local stabilization of distinctions into discrete, identifiable, addressable entities. Permitted only in Logos."
  status: "SOURCE"
  origin: "CORPUS"
  source: "S1: CORE/operators.yaml; S6: OPERATORS.md"
  domain: [mm:core.dom.logos]
  input: "Distinction"
  transformation: "Local stabilization / discretization"
  output: "Entity / Representation (addressable)"
  preserves: ["Operational identity: fix(x) = x within a model"]
  destroys: []
  enables: ["Formal modeling, prediction, scientific formalization"]
  prohibits:
    - "fix must not be global"
    - "fix must not be permanent"
    - "fix must not exist in Monos"
  relations:
    - relation: mm:rel.derives_from
      target: mm:core.op.diff
      status: "SOURCE"

- id: mm:core.op.unfold
  canonical_name: "unfold"
  type: "Operator"
  layer: "core"
  definition: >
    Enforced rupture. Invalidates fixation when closure is detected.
    This is a DYNAMIC operator of processual transition (Logos → Monos),
    distinct from maps_to which is a STATIC relation of representation.
  status: "SOURCE"
  origin: "CORPUS"
  source: "S6: OPERATORS.md; S6: GLOSSARY.md"
  domain: ["Logos→Monos bridge (dynamic)"]
  input: "Self-identity lock / closure"
  transformation: "Enforced rupture of fixation"
  output: "Processual matrix (reintroduced differentiation)"
  destroys: ["Dominant invariants", "Fixation"]
  prohibits:
    - "unfold must not generate content"
    - "unfold must not evaluate outcomes"
    - "unfold must not select trajectories"
  relations:
    - relation: mm:rel.triggered_by
      target: mm:core.sts.self_identity_lock
      status: "SOURCE"
  claims:
    - mm:core.clm.unfold_is_dynamic_bridge
    - mm:core.clm.maps_to_is_static_projection
    - mm:core.clm.unfold_vs_maps_to_distinction

- id: mm:core.op.reflection
  canonical_name: "reflection"
  type: "Cognitive Operation"
  layer: "core"
  definition: "Logos distinguishes distinction."
  status: "SOURCE"
  origin: "CORPUS"
  source: "A1: the_verb.md (Axiom 3.1)"
  domain: [mm:core.dom.logos]
  relations:
    - relation: mm:rel.iterates_to
