  - {id: mm:c.clm.big_bang_metric_expansion_ontologically_impossible, category: cosmological_model, status: MODEL_SPECIFIC, text: "Within the ONTODYNAMICS model, Big Bang / metric expansion is treated as ontologically impossible under the Ban."}
  - {id: mm:c.clm.baryon_birth_death_necessary, category: cosmological_model, status: MODEL_SPECIFIC, text: "Baryon birth and death are treated as necessary within the eternal dynamic model; mechanisms remain empirical questions."}
