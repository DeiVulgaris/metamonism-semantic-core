# Stage 13D — Inventory C Claim Registration

stage:
  id: "13D"
  title: "Claim Registration — Inventory C"
  source_inventory: "C"
  source: "ONTODYNAMICS"
  status: "SOURCE_REGISTRATION"
  namespace: "mm:c.clm."

rules:
  - "Claims preserve ONTODYNAMICS layer scope."
  - "Canonical-within-layer is not CORE status."
  - "Proposed, hypothesis, and draft claims retain their source status."
  - "Model-language mappings do not create new CORE operators."
  - "No cross-source synthesis is introduced."
  - "No sameAs, identical_to, implements, proves, independent_of, or unrelated_to."

claims:
  - {id: mm:c.clm.ontodynamics_predictive_applied_layer, category: layer_role, status: SOURCE, text: "ONTODYNAMICS is the predictive/applied layer of Wayward Metamonism."}
  - {id: mm:c.clm.core_defines_axioms_ontodynamics_unfolds_worlds, category: layer_dependency, status: SOURCE, text: "CORE defines immutable axioms while ONTODYNAMICS unfolds them into Worlds."}
  - {id: mm:c.clm.models_are_processual_ontology_specifications, category: model_scope, status: SOURCE, text: "ONTODYNAMICS models are operational specifications of one processual ontology, not independent theories."}
  - {id: mm:c.clm.models_purpose_falsifiable_structure, category: methodology, status: SOURCE, text: "The purpose of the models is to provide falsifiable structure."}
  - {id: mm:c.clm.core_what_reality_is_ontodynamics_what_implies, category: layer_role, status: SOURCE, text: "CORE addresses what reality is; ONTODYNAMICS addresses what follows physically."}
  - {id: mm:c.clm.models_derive_from_core_ban, category: derivation_constraint, status: SOURCE, text: "Every ONTODYNAMICS model must derive from CORE axioms, especially the Ban of Absolute Identity."}
  - {id: mm:c.clm.models_use_diff_diss_fix_language, category: operator_language, status: SOURCE, text: "ONTODYNAMICS models use diff, diss, and fix as model language."}

  # Canonical processual claims within ONTODYNAMICS
  - {id: mm:c.clm.reality_self_regulating_dissipation, category: ontodynamic_principle, status: CANONICAL_WITHIN_LAYER, text: "Reality is described as self-regulating dissipation from prohibition of absolute identity."}
  - {id: mm:c.clm.existence_begins_unresolved_conflict, category: ontodynamic_principle, status: CANONICAL_WITHIN_LAYER, text: "Existence begins as unresolved conflict."}
  - {id: mm:c.clm.conflict_redistributed_not_eliminated, category: ontodynamic_principle, status: CANONICAL_WITHIN_LAYER, text: "Conflict is redistributed rather than eliminated."}
  - {id: mm:c.clm.redistribution_new_dof_is_dissipation, category: ontodynamic_principle, status: CANONICAL_WITHIN_LAYER, text: "Redistribution into new degrees of freedom is dissipation."}
  - {id: mm:c.clm.dissipation_not_loss, category: ontodynamic_principle, status: CANONICAL_WITHIN_LAYER, text: "Dissipation is not equivalent to loss."}
  - {id: mm:c.clm.orthogonality_minimal_channel, category: ontodynamic_principle, status: CANONICAL_WITHIN_LAYER, text: "Orthogonality is treated as the minimal channel of dissipation."}
  - {id: mm:c.clm.metric_unfolding_0d_to_3d, category: metric_model, status: CANONICAL_WITHIN_LAYER, text: "Metric unfolding is described from 0D to 1D to 2D to 3D, followed by node multiplicity."}
  - {id: mm:c.clm.orthogonal_dissipation_layer_canonical, category: layer_principle, status: CANONICAL_WITHIN_LAYER, text: "Orthogonal Dissipation is canonical within ONTODYNAMICS, not a global CORE principle."}
  - {id: mm:c.clm.derived_gravity_shadow_orbit_force_mass, category: model_consequence, status: CANONICAL_WITHIN_LAYER, text: "Gravity-shadow, orbit compensation, force modalities, and mass localization are derived effects within the ONTODYNAMICS model family."}
  - {id: mm:c.clm.gravity_not_attraction, category: gravity_model, status: CANONICAL_WITHIN_LAYER, text: "Gravity is modeled not as attraction but as a local deficit in global dissipation between screening sources."}

  # Fundamental interactions
  - {id: mm:c.clm.fundamental_interactions_one_process, category: physical_model, status: PROPOSED, text: "The four fundamental interactions are proposed as geometric regimes of one ontological process."}
  - {id: mm:c.clm.fundamental_interactions_falsifiable, category: physical_model, status: PROPOSED, text: "The Fundamental Interactions model is proposed as falsifiable."}
  - {id: mm:c.clm.fundamental_interactions_field_equations_open, category: unresolved, status: UNRESOLVED, text: "Field equations, couplings, and Standard Model/general relativity limits remain open."}

